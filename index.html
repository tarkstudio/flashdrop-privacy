## 1. Introduction and Commitment

FlashDrop ("Application," "we," "us," or "our") is committed to transparency regarding information practices. This Privacy Policy explains in precise technical detail what information the Application accesses, how it is used, and how it is protected â€” or, as is predominantly the case, **why no information leaves your device at all.**

## 2. Architecture Overview: Offline-First, Zero-Server Design

FlashDrop operates on a **purely offline peer-to-peer (P2P) architecture.** This is a foundational design principle, not merely a configuration choice.

### 2.1 What This Means for Your Data

- **No remote servers:** FlashDrop does not operate, own, lease, or use any backend servers, cloud APIs, or data centers to route, store, or process your files.
- **No data uploads:** At no point does the Application transmit your files, file names, file metadata, usage patterns, analytics events, device identifiers, or any other information to the Developer or to any third-party remote service.
- **No accounts required:** FlashDrop requires no user registration, account creation, or identity verification. No username, password, email address, or personal identifier is collected by the Developer.
- **Local socket only:** All file transfers occur directly between two devices on the same local network segment via raw TCP/UDP sockets, Wi-Fi Direct protocols, or local hotspot streams. Data never traverses the public internet.

### 2.2 Peer-to-Peer Transfer Model

When you transfer a file using FlashDrop:

1. Your device opens a **local socket** (e.g., on `192.168.x.x` or a link-local address) and advertises availability within the local network only.
2. A receiving device discovers this socket via **mDNS/Bonjour broadcast, QR code scan, or manual IP entry** â€” all local operations.
3. The file is streamed directly from the sending device's local storage to the receiving device's local storage via the established socket.
4. **The Developer's systems are never involved.** No data is routed through us at any stage.

---

## 3. Permissions Used and Their Justification

The Application requests certain Android system permissions. Each permission is used solely for the technical operation of local file transfers. The Developer makes the following binding representations:

| Permission | Purpose | Remote Telemetry? |
|---|---|---|
| `READ_EXTERNAL_STORAGE` / `READ_MEDIA_*` | Read files selected by the user for outbound transfer | âŒ Never |
| `WRITE_EXTERNAL_STORAGE` | Write incoming files to the device's storage | âŒ Never |
| `ACCESS_WIFI_STATE` / `CHANGE_WIFI_STATE` | Detect active network interfaces for socket binding | âŒ Never |
| `ACCESS_NETWORK_STATE` | Check local network connectivity before initiating streams | âŒ Never |
| `CHANGE_NETWORK_STATE` | Configure local hotspot or Wi-Fi Direct connections | âŒ Never |
| `NEARBY_WIFI_DEVICES` | Discover peer devices for Wi-Fi Direct pairing (Android 12+) | âŒ Never |
| `ACCESS_FINE_LOCATION` / `ACCESS_COARSE_LOCATION` | Required by Android OS for Wi-Fi scanning APIs (no location data is stored or transmitted) | âŒ Never |
| `FOREGROUND_SERVICE` / `FOREGROUND_SERVICE_DATA_SYNC` | Keep transfer socket alive during background/screen-off scenarios | âŒ Never |
| `CAMERA` (optional) | Scan QR codes for peer discovery; no images are stored | âŒ Never |
| `POST_NOTIFICATIONS` | Display transfer progress notifications | âŒ Never |

**No permission is used for telemetry, behavioral tracking, advertising profiling, or any purpose other than enabling local P2P file transfer.**

### 3.1 Location Permission Clarification

Android's Wi-Fi scanning API (`WifiManager.startScan()`, `WifiP2pManager`) mandates the `ACCESS_FINE_LOCATION` permission at the operating system level. **FlashDrop does not read, record, process, or transmit your geographic location.** This permission is an OS-enforced prerequisite for Wi-Fi Direct peer discovery and is used for no other purpose whatsoever.

All locally stored data remains under your exclusive control. You may delete it at any time via the Application's settings, your device's app management interface, or by uninstalling the Application.

### 6.1 Encryption Status

In its current version, FlashDrop performs transfers over **plain TCP/UDP sockets without end-to-end application-layer encryption.** Transfers rely on the security of the local network environment.

### 6.2 User Responsibility for Network Security

**IMPORTANT:** Transfers over **open, unencrypted, or public Wi-Fi networks** are undertaken entirely at the User's own risk and discretion. The Developer explicitly discloses that:

- The Developer is **not liable** for any privacy breach, data exposure, or unauthorized access arising from the User's choice to operate the Application on an open or untrusted network.

    });

    function switchTab(tabId) {
      // 1. Remove active state from all contents and buttons
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      // 2. Add active state to selected
      if (tabId === 'privacy') {
        document.getElementById('privacy-content').classList.add('active');
        document.getElementById('btn-privacy').classList.add('active');
      } else {
        document.getElementById('tos-content').classList.add('active');
        document.getElementById('btn-tos').classList.add('active');
      }
      
      // Smooth scroll back to top of content
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
